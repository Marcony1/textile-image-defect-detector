<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 300" width="718" height="300" role="img" aria-label="De la foto a la decisión: recorrido completo" style="font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:#ffffff">
<title>De la foto a la decisión: recorrido completo</title>
<defs><marker id="ar_pipe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52514e"/></marker></defs>
<rect x="20" y="30" width="150" height="74" rx="7" fill="#f4f4f1" stroke="#8a8984" stroke-width="1.3"/><text x="95.0" y="65.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Foto de la toalla</text><text x="95.0" y="80.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">3580 × 2150 px</text><rect x="196" y="30" width="150" height="74" rx="7" fill="#f4f4f1" stroke="#8a8984" stroke-width="1.3"/><text x="271.0" y="65.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Máscara de la toalla</text><text x="271.0" y="80.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">ignora fondo y máquina</text><rect x="372" y="30" width="150" height="74" rx="7" fill="#f4f4f1" stroke="#8a8984" stroke-width="1.3"/><text x="447.0" y="65.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Recortes de 512 px</text><text x="447.0" y="80.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">25 % de traslape</text><text x="447.0" y="93.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">≈ 40–60 por toalla</text><rect x="548" y="30" width="150" height="74" rx="7" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.3"/><text x="623.0" y="65.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">2 redes EfficientNet-B0</text><text x="623.0" y="80.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">misma arquitectura,</text><text x="623.0" y="93.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">distinto entrenamiento</text><rect x="20" y="164" width="150" height="74" rx="7" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.3"/><text x="95.0" y="199.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">P(defecto) por recorte</text><text x="95.0" y="214.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">promedio de las 2 redes</text><rect x="196" y="164" width="150" height="74" rx="7" fill="#fde2c4" stroke="#d0702b" stroke-width="1.3"/><text x="271.0" y="199.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Score de la toalla</text><text x="271.0" y="214.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">promedio de los 2</text><text x="271.0" y="227.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">recortes más sospechosos</text><rect x="372" y="164" width="150" height="74" rx="7" fill="#fde2c4" stroke="#d0702b" stroke-width="1.3"/><text x="447.0" y="199.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Calibración por cámara</text><text x="447.0" y="214.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">z = (score − mediana OK)</text><text x="447.0" y="227.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">÷ rango intercuartil OK</text><rect x="548" y="164" width="150" height="74" rx="7" fill="#e7f6e7" stroke="#0ca30c" stroke-width="1.3"/><text x="623.0" y="199.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Decisión</text><text x="623.0" y="214.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">z ≥ umbral → NO OK</text><text x="623.0" y="227.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">+ mapa de calor</text><line x1="170.0" y1="67.0" x2="194.0" y2="67.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_pipe)"/><line x1="346.0" y1="67.0" x2="370.0" y2="67.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_pipe)"/><line x1="522.0" y1="67.0" x2="546.0" y2="67.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_pipe)"/><path d="M623.0 104 L623.0 134 L95.0 134 L95.0 162" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_pipe)"/><line x1="170.0" y1="201.0" x2="194.0" y2="201.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_pipe)"/><line x1="346.0" y1="201.0" x2="370.0" y2="201.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_pipe)"/><line x1="522.0" y1="201.0" x2="546.0" y2="201.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_pipe)"/><text x="20.0" y="290.0" font-size="10.5" fill="#8a8984" text-anchor="start" font-weight="400">Azul: la red neuronal · Naranja: cómo se combinan y calibran sus salidas · Verde: decisión que se envía al tablero y al PLC</text>
</svg>
