<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 182" width="910" height="182" role="img" aria-label="Bloque MBConv de EfficientNet" style="font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:#ffffff">
<title>Bloque MBConv de EfficientNet</title>
<defs><marker id="ar_mb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52514e"/></marker></defs>
<rect x="16" y="30" width="128" height="70" rx="7" fill="#f4f4f1" stroke="#8a8984" stroke-width="1.3"/><text x="80.0" y="63.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Entrada</text><text x="80.0" y="78.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">H×W×C</text><rect x="166" y="30" width="128" height="70" rx="7" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.3"/><text x="230.0" y="63.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Conv 1×1</text><text x="230.0" y="78.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">expande ×6 (×1 en etapa 1)</text><text x="230.0" y="91.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">H×W×6C</text><line x1="144.0" y1="65.0" x2="164.0" y2="65.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_mb)"/><rect x="316" y="30" width="128" height="70" rx="7" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.3"/><text x="380.0" y="63.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Conv k×k</text><text x="380.0" y="78.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">por canal (depthwise)</text><text x="380.0" y="91.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">k = 3 o 5</text><line x1="294.0" y1="65.0" x2="314.0" y2="65.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_mb)"/><rect x="466" y="30" width="128" height="70" rx="7" fill="#fde2c4" stroke="#d0702b" stroke-width="1.3"/><text x="530.0" y="63.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Atención SE</text><text x="530.0" y="78.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">pesa cada canal</text><text x="530.0" y="91.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">(squeeze-excitation)</text><line x1="444.0" y1="65.0" x2="464.0" y2="65.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_mb)"/><rect x="616" y="30" width="128" height="70" rx="7" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.3"/><text x="680.0" y="63.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Conv 1×1</text><text x="680.0" y="78.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">proyecta a C'</text><text x="680.0" y="91.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">H'×W'×C'</text><line x1="594.0" y1="65.0" x2="614.0" y2="65.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_mb)"/><rect x="766" y="30" width="128" height="70" rx="7" fill="#e7f6e7" stroke="#0ca30c" stroke-width="1.3"/><text x="830.0" y="63.0" font-size="12.5" fill="#1b1b1a" text-anchor="middle" font-weight="600">Suma</text><text x="830.0" y="78.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">con la entrada</text><text x="830.0" y="91.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">(si C' = C)</text><line x1="744.0" y1="65.0" x2="764.0" y2="65.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar_mb)"/><path d="M80.0 100 L80.0 128 L830.0 128 L830.0 102" fill="none" stroke="#0ca30c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar_mb)"/><text x="455.0" y="145.0" font-size="10.5" fill="#0ca30c" text-anchor="middle" font-weight="400">conexión residual: la red aprende solo la corrección; facilita entrenar redes profundas</text><text x="16.0" y="172.0" font-size="10.5" fill="#8a8984" text-anchor="start" font-weight="400">Bloque MBConv (convolución invertida con cuello de botella). Las capas convolucionales usan normalización por lotes y activación SiLU.</text>
</svg>
