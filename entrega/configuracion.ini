; =====================================================================
;  Configuración del inspector de toallas
;  Edite este archivo con el Bloc de notas y guarde. Los cambios se
;  aplican la próxima vez que abra INICIAR.
;  Las rutas pueden ser relativas a esta carpeta (ej. entrada) o
;  completas (ej. D:\Camara\fotos  o  \\SERVIDOR\Compartida\fotos).
; =====================================================================

[carpetas]
; Carpeta que el programa vigila: la cámara (o la Raspberry Pi) guarda aquí cada foto.
entrada = entrada
; Aquí se mueven las fotos ya analizadas, por fecha y en subcarpetas OK / NO_OK / errores.
procesadas = procesadas

[inspeccion]
; Qué tan estricto es el sistema:
;   recall_98 = detecta más defectos, pero manda más toallas buenas a revisión
;   recall_95 = intermedio (recomendado para empezar)
;   recall_90 = menos revisiones, se escapan más defectos
ajuste = recall_95
; Escala de la foto. Déjelo en "auto": se usa la que calcule CALIBRAR
; (o 1.0, que corresponde a la cámara con la que se entrenó el sistema).
escala = auto
; Nombre que aparece en la pantalla.
nombre_linea = Línea de prueba
; Alertas: cuántas NO OK seguidas y qué fracción de NO OK (en las últimas 50) disparan un aviso.
alerta_seguidas = 5
alerta_fraccion = 0.5

[pantalla]
; Puerto del tablero: se abre en http://localhost:8000
puerto = 8000
; si = otras computadoras de la red interna pueden ver el tablero (http://IP-de-esta-PC:8000)
;      y la Raspberry Pi puede enviar fotos por la red. No lo exponga a internet: no tiene contraseña.
permitir_red = no
; Abrir el navegador automáticamente al iniciar.
abrir_navegador = si

[marca]
; Logo (PNG, JPG o SVG) dentro de la carpeta "marca". Déjelo vacío para no mostrar logo.
logo = marca/logo_galia.png
nombre = Galia Textil
; Colores oficiales en formato #RRGGBB (Galia: azul marino #03244D y naranja #FF6501).
; Principal = botones; secundario = franja superior. Vacío = colores por defecto.
; El texto sobre el color principal se elige solo (blanco o negro) para que se lea bien.
color_principal = #03244D
color_secundario = #FF6501
