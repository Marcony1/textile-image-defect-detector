# Entorno del pipeline v2 (notebooks 05-09, scripts 04-08 y predict.py).
#   conda env create -f environment.yml
#   conda activate galia_v2
#   python -m ipykernel install --user --name galia_v2
# PyTorch con CUDA 12.1 (funciona con drivers NVIDIA >= 530). Para CPU, quitar la línea --extra-index-url.
# Los notebooks 01-04 (históricos) usan además tensorflow para scripts/01_data_preprocessing.py.
name: galia_v2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.5.1
    - torchvision==0.20.1
    - ultralytics==8.4.215
    - anomalib[core]==2.7.0
    - timm==1.0.31
    - iterative-stratification==0.1.9
    - scikit-learn==1.9.1
    - opencv-python==5.0.0.93
    - pandas
    - matplotlib
    - seaborn
    - pyyaml
    - pillow
    - ipykernel
    - nbconvert
